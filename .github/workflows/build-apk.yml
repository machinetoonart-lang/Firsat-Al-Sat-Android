name: APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac
        run: |
          mkdir -p android-project
          unzip -q Firsat_Al_Sat_Android_V31_49_S25FE_FULL_SOURCE.zip -d android-project
          echo "ZIP acildi"
          find android-project -maxdepth 3 -type f | head -100

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK olustur
        run: |
          GRADLEW=$(find android-project -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "HATA: gradlew ZIP icinde bulunamadi"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Android proje klasoru: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Firsat-Al-Sat-APK
          path: android-project/**/*.apk
          if-no-files-found: error
